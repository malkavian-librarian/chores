{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Chores{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="bg-stone-50 text-stone-900">
  <nav class="border-b border-stone-200 bg-white">
    <div class="max-w-2xl mx-auto flex gap-6 px-4 py-3">
      <a href="{% if household %}{% url 'households:detail' slug=household.slug %}{% else %}{% url 'households:index' %}{% endif %}">Household</a>
      <a href="{% if household %}{% url 'categories:index' slug=household.slug %}{% else %}{% url 'households:index' %}{% endif %}">Categories</a>
      <a href="{% if household %}{% url 'households:settings' slug=household.slug %}{% else %}{% url 'households:index' %}{% endif %}">Settings</a>
    </div>
  </nav>
  <main class="max-w-2xl mx-auto px-4 py-6">
    {% if messages %}
      <ul class="messages">
        {% for message in messages %}
          <li class="message {{ message.tags }}">{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
