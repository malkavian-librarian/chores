{% extends "base.html" %}

{% block content %}
  <h1>Settings</h1>
  <h2>Rename partners</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
  </form>

  <h2>Reset data</h2>
  <p>Select what to clear. Nothing is deleted until you confirm on the next page.</p>
  <form method="post" action="{% url 'households:reset_data' slug=household.slug %}">
    {% csrf_token %}
    {{ reset_form.as_p }}
    <button type="submit">Continue</button>
  </form>
{% endblock %}
