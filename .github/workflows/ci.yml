name: CI

# This repo has no other long-lived branches per the existing backlog,
# so triggering on push/pull_request to `main` only is intentionally
# narrow (see issue #22 / arch.md §11).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Required so Django/pytest resolve settings the same way they do
  # locally and in pyproject.toml's [tool.pytest.ini_options]. Omitting
  # this is the most likely silent-failure trap for this workflow.
  DJANGO_SETTINGS_MODULE: config.settings.dev

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Django system check
        run: uv run python manage.py check

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest
