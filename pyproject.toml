[project]
name = "chores"
version = "0.1.0"
description = "Household Chores MVP"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.0,<6.0",
    "django-environ>=0.11",
    "whitenoise>=6.7",
    "gunicorn>=22.0",
    "psycopg[binary]>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "DJ"]

[tool.uv]
package = false
